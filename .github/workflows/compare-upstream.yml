name: compare-upstream

on:
  pull_request:
    branches: [main, next, tier2/refactor]
    paths:
      - "src/**"
      - "tests/compare/**"
      - "scripts/compare/**"
      - ".github/workflows/compare-upstream.yml"
      - "package.json"
  schedule:
    - cron: "0 7 * * *"   # nightly 07:00 UTC
  workflow_dispatch:
    inputs:
      include_workflows:
        description: "Run real-life workflows"
        required: false
        default: "true"
      include_stats_validate:
        description: "Run ctx_stats validation"
        required: false
        default: "true"
      os_matrix:
        description: "OS to run on (ubuntu, windows, both)"
        required: false
        default: "ubuntu"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: compare-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        # Nightly + manual dispatch run both OSes. PR runs Ubuntu only by default
        # to keep PR feedback fast — switch via workflow_dispatch os_matrix input.
        os: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.os_matrix == 'both')) && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install fork deps
        run: npm install --no-audit --no-fund

      - name: Build fork
        run: npm run build

      - name: Clone + build upstream
        run: npm run compare:setup

      - name: Run per-tool parity suites
        run: npm run compare:all

      - name: Run real-life workflows
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.include_workflows != 'false' }}
        run: npm run compare:workflows

      - name: Run ctx_stats validation
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.include_stats_validate != 'false' }}
        run: npm run compare:stats-validate

      - name: Aggregate token breakdown
        if: always()
        run: npm run compare:tokens
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-reports-${{ matrix.os }}-${{ github.run_id }}
          path: build/compare/
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && github.event.pull_request.head.repo.full_name == github.repository && always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const dir = 'build/compare';
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.md')).sort();
            const pick = (prefix) => files.filter(f => f.startsWith(prefix)).pop();
            const parts = [];
            const all = pick('all-');
            const wf  = pick('workflows-');
            const sv  = pick('stat-validate-');
            const tk  = pick('tokens-');
            for (const [label, f] of [['Per-tool', all], ['Workflows', wf], ['Stat validation', sv], ['Token breakdown', tk]]) {
              if (!f) continue;
              const body = fs.readFileSync(path.join(dir, f), 'utf8');
              const summary = body.split('\n').slice(0, 30).join('\n');
              parts.push(`### ${label} (\`${f}\`)\n\n${summary}\n...`);
            }
            if (parts.length === 0) return;
            const out = `## Fork vs upstream comparison\n\n${parts.join('\n\n')}\n\n_Full reports in run artifacts._`;
            const MAX = 60000;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: out.length > MAX ? out.slice(0, MAX) + '\n\n_(truncated)_' : out,
            });
